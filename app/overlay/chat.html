<!DOCTYPE html>
<!-- Чат Twitch. Для OBS: прозорий, нові знизу. ?window=1 — окреме вікно (темний фон, прокрутка, час).
     Параметри: ?limit=40&fade=0 (сек, 0 — не зникати)&hide=nightbot,streamelements&size=18&badges=1&orders=1 -->
<html lang="uk"><head><meta charset="utf-8"><title>PhillBot — чат</title>
<link rel="stylesheet" href="overlay.css">
<style>
  :root{--size:18px}
  body{font-weight:600;font-size:var(--size)}
  #list{position:fixed;left:0;right:0;bottom:0;padding:6px 10px;display:flex;flex-direction:column;justify-content:flex-end;max-height:100%}
  .cmsg{padding:3px 6px;border-radius:6px;line-height:1.35;overflow-wrap:anywhere;transition:opacity .6s}
  .cmsg.gone{opacity:0}
  .cbadge{height:1.05em;vertical-align:-0.15em;margin-right:3px}
  .cemote{height:1.6em;vertical-align:middle;margin:-.2em 1px}
  .cname{font-weight:800}
  .cmention{color:#ffd35a}
  .ctime{color:#a0a0aa;font-size:.8em;margin-right:6px;font-weight:400}
  .ctag{margin-left:8px;font-size:.75em;background:var(--accent);color:#fff;border-radius:4px;padding:0 5px;text-shadow:none}
  .cmsg.order{background:rgba(145,71,255,.28);border-left:3px solid var(--accent)}
  .cmsg.reward{border-left:3px solid #5fe3dc}
  .cmsg.hl{background:rgba(0,181,173,.22)}
  .cmsg.mention{background:rgba(255,211,90,.18)}
  /* окреме вікно */
  body.win{background:#0e0e10;overflow:auto;text-shadow:none;font-weight:400;font-family:var(--font-ui)}
  body.win #list{position:static;justify-content:flex-start;max-height:none;padding:8px 10px 40px}
  body.win .cmsg{padding:4px 6px}
  body.win .cmsg:hover{background:#1f1f23}
  #more{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#9147ff;color:#fff;border:0;border-radius:16px;padding:6px 14px;font:600 13px var(--font-ui);cursor:pointer}
  #head{position:sticky;top:0;background:#18181b;border-bottom:1px solid #2f2f35;padding:8px 12px;font:600 13px var(--font-ui);color:#adadb8;z-index:2}
</style></head>
<body>
<div id="head" class="hidden"></div>
<div id="list"></div>
<button id="more" class="hidden">↓ Нові повідомлення</button>
<script src="overlay.js"></script>
<script src="chatrender.js"></script>
<script>
(() => {
  const win = OV.flag("window", false);
  const limit = OV.num("limit", win ? 300 : 40), fade = OV.num("fade", 0) * 1000;
  const hide = new Set(OV.param("hide", "").toLowerCase().split(",").map(s => s.trim()).filter(Boolean));
  const opts = { time: win || OV.flag("time", false), badges: OV.flag("badges", true), orderTag: OV.flag("orders", true) };
  document.documentElement.style.setProperty("--size", (win ? OV.num("size", 14) : OV.num("size", 18)) + "px");
  if (win) { document.body.className = "win"; document.getElementById("head").classList.remove("hidden"); }
  const list = document.getElementById("list"), more = document.getElementById("more");
  let pending = [], stick = true;

  const atBottom = () => !win || (innerHeight + scrollY >= document.body.scrollHeight - 30);
  if (win) {
    addEventListener("scroll", () => { stick = atBottom(); if (stick) more.classList.add("hidden"); });
    more.onclick = () => { scrollTo(0, document.body.scrollHeight); more.classList.add("hidden"); };
  }
  function flush() {
    if (!pending.length) return;
    const nodes = pending.splice(0).filter(m => !hide.has((m.login || "").toLowerCase())).map(m => {
      const n = ChatRender.render(m, opts);
      if (fade > 0 && !win) setTimeout(() => { n.classList.add("gone"); setTimeout(() => n.remove(), 700); }, fade);
      return n;
    });
    list.append(...nodes);
    while (list.children.length > limit) list.firstChild.remove();
    if (win) { if (stick) scrollTo(0, document.body.scrollHeight); else if (nodes.length) more.classList.remove("hidden"); }
  }
  setInterval(flush, 150); // пакетний рендер — не навантажувати OBS на великих каналах

  fetch(OV.base + "api/chat").then(r => r.json()).then(msgs => { pending = (msgs || []).slice(-limit).concat(pending); flush(); });
  OV.connect({
    state: s => { document.getElementById("head").textContent = "Чат " + (s.channel || ""); document.title = "Чат " + (s.channel || ""); },
    chat: m => pending.push(m),
    closewin: () => { if (win) window.close(); },
    chatdel: d => {
      if (d.all) { list.replaceChildren(); pending = []; return; }
      const ids = new Set(d.ids || []);
      for (const n of [...list.children]) if (ids.has(n.dataset.id) || (d.userId && n.dataset.user === d.userId)) n.remove();
      pending = pending.filter(m => !ids.has(m.id) && m.userId !== d.userId);
    }
  });
})();
</script>
</body></html>
