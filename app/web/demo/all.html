<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhillBot — усі екрани</title>
<meta name="description" content="Усі екрани PhillBot на одній сторінці: збір замовлень, гра переможця, аукціон, колесо й налаштування — живе демо на вигаданих даних.">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  @font-face{font-family:"Unbounded";font-display:swap;font-weight:200 900;src:url(/fonts/unbounded-cyrillic-wght-normal.woff2) format("woff2-variations");unicode-range:U+0400-045F,U+0490-0491}
  @font-face{font-family:"Unbounded";font-display:swap;font-weight:200 900;src:url(/fonts/unbounded-latin-wght-normal.woff2) format("woff2-variations");unicode-range:U+0000-00FF,U+2000-206F}
  :root{--bg:#0b0b0d;--panel:#18181b;--line:#2a2a30;--text:#efeff1;--muted:#adadb8;--accent:#9147ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;padding:28px 32px 48px}
  header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;max-width:1680px;margin:0 auto 24px}
  h1{font:700 22px/1.2 "Unbounded","Segoe UI",sans-serif;margin:0}
  header p{margin:0;color:var(--muted)}
  header a{color:#bf94ff;display:inline-block;padding:10px 4px;margin:-10px 0}
  main{max-width:1680px;margin:0 auto}
  /* одна рівна сітка: 8 екранів — 4×2, 2×4 або 1 стовпчик, без порожніх клітинок */
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
  @media (max-width:1500px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  a.card{display:block;color:inherit;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .15s}
  a.card:hover{border-color:#6b4fb0}
  .cap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line);min-height:56px}
  .cap small{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
  .cap b{font-weight:600}
  .open{flex:0 0 auto;display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border:1px solid #3a3a42;border-radius:8px;font-size:13px;color:var(--text)}
  a.card:hover .open{border-color:#9147ff;background:#9147ff}
  .shot{position:relative;aspect-ratio:1440/900;overflow:hidden;background:#0e0e10}
  .shot iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0;pointer-events:none}
  .shot .wait{position:absolute;left:14px;bottom:12px;color:var(--muted);font-size:12px}
  a:focus-visible{outline:2px solid #bf94ff;outline-offset:3px}
  @media (max-width:760px){body{padding:20px 16px}.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header>
  <h1>PhillBot — усі екрани</h1>
  <p>Живе демо на вигаданих даних. · <a href="/">Увійти</a></p>
</header>
<main id="board"></main>
<script>
(function(){
  "use strict";
  const groups = [
    ["СабДей", [["subday", "Збір замовлень"], ["game", "Гра переможця й голосування"], ["streams", "Журнал стрімів"]]],
    ["Переглядовий", [["auction", "Аукціон: прийом ставок"], ["wheel", "Колесо на вибування"]]],
    ["Налаштування", [["settings", "Загальні налаштування"], ["subdaysettings", "Налаштування СабДею"], ["ausettings", "Налаштування аукціону"]]],
  ];
  const board = document.getElementById("board"), frames = [], grid = document.createElement("div");
  grid.className = "grid"; board.appendChild(grid);
  groups.forEach(([title, items]) => items.forEach(([scene, name]) => {
    const a = document.createElement("a"); // уся картка — посилання на живе демо цього екрана
    a.className = "card"; a.href = `/demo?scene=${scene}`; a.target = "_blank"; a.rel = "noopener";
    a.innerHTML = `<div class="cap"><span><small>${title}</small><b>${name}</b></span><span class="open" aria-hidden="true">Відкрити ↗</span></div>
      <div class="shot"><span class="wait">Завантаження…</span></div>`;
    grid.appendChild(a);
    frames.push({scene, name, shot: a.querySelector(".shot")});
  }));
  const fit = () => frames.forEach(x => { if(x.ifr) x.ifr.style.transform = `scale(${x.shot.clientWidth / 1440})`; });
  addEventListener("resize", fit);
  // кадр вантажиться, лише коли наближається до екрана (кожен — окреме живе демо, не варто запускати всі одразу);
  // і по одному: кожне демо на старті запам'ятовує свою вкладку, і так вони не переплутаються
  const queue = []; let busy = false;
  const pump = () => {
    if(busy || !queue.length) return;
    busy = true;
    const x = queue.shift(), ifr = document.createElement("iframe");
    ifr.src = `/demo?scene=${x.scene}&embed=1`; ifr.title = x.name; ifr.tabIndex = -1; ifr.setAttribute("aria-hidden", "true");
    x.ifr = ifr; x.shot.appendChild(ifr); fit();
    ifr.addEventListener("load", () => { const w = x.shot.querySelector(".wait"); if(w) w.remove(); setTimeout(() => { busy = false; pump(); }, 150); }, {once: true});
  };
  // перевірка за координатами (не IntersectionObserver): працює й там, де сторінка ще не малюється
  const check = () => frames.forEach(x => {
    if(x.queued || x.shot.getBoundingClientRect().top > innerHeight + 200) return;
    x.queued = true; queue.push(x); pump();
  });
  addEventListener("scroll", check, {passive: true}); addEventListener("resize", check); check();
})();
</script>
</body></html>
