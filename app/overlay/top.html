<!DOCTYPE html>
<!-- Топ замовлень. Параметри: ?limit=5&users=0&title=Топ замовлень&hideEmpty=1&scale=1&theme=shadow|box|plain -->
<html lang="uk"><head><meta charset="utf-8"><title>СабДей — топ</title>
<link rel="stylesheet" href="overlay.css">
<style>
  #w{width:100%}
  h1{font-size:calc(22px * var(--scale));margin:0 0 calc(8px * var(--scale));color:var(--muted);font-weight:700}
  .row{display:grid;grid-template-columns:calc(34px * var(--scale)) 1fr auto;gap:calc(8px * var(--scale));align-items:center;margin-bottom:calc(8px * var(--scale));transition:transform .4s}
  .rk{color:var(--accent);text-align:right}
  .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pt{font-variant-numeric:tabular-nums}
  .bar{grid-column:2 / 4;height:calc(6px * var(--scale));background:var(--accent);border-radius:4px;margin-top:calc(-4px * var(--scale));transition:width .5s;box-shadow:0 1px 3px rgba(0,0,0,.6)}
  .us{grid-column:2 / 4;font-size:calc(14px * var(--scale));color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{color:var(--muted)}
</style></head>
<body>
<div id="w" class="box"><h1 id="h"></h1><div id="list"></div></div>
<script src="overlay.js"></script>
<script>
(() => {
  const limit = Math.max(1, OV.num("limit", 5)), showUsers = OV.flag("users", false), hideEmpty = OV.flag("hideEmpty", true);
  const title = OV.param("title", "Топ замовлень");
  const h = document.getElementById("h"), list = document.getElementById("list"), w = document.getElementById("w");
  h.textContent = title; h.classList.toggle("hidden", !title);
  function render(S) {
    const top = (S.top || []).slice(0, limit), max = Math.max(1, ...top.map(g => g.points));
    w.classList.toggle("hidden", hideEmpty && !top.length);
    list.replaceChildren(...(top.length ? top.map((g, i) => {
      const r = document.createElement("div"); r.className = "row";
      const rk = document.createElement("span"); rk.className = "rk"; rk.textContent = (i + 1) + ".";
      const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = g.name;
      const pt = document.createElement("span"); pt.className = "pt"; pt.textContent = g.points;
      const bar = document.createElement("div"); bar.className = "bar"; bar.style.width = Math.round(g.points / max * 100) + "%";
      r.append(rk, nm, pt, document.createElement("span"), bar);
      if (showUsers) { const us = document.createElement("div"); us.className = "us"; us.textContent = g.users.map(u => u.name).join(", "); r.append(document.createElement("span"), us); }
      return r;
    }) : [Object.assign(document.createElement("div"), { className: "empty", textContent: "Замовлень поки немає" })]));
  }
  OV.connect({ state: render });
})();
</script>
</body></html>
