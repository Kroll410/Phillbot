name: Build PhillBot

# Робочий процес:
#   main  ──PR──▶  build
# - PR у гілку build        → лише тести (перевірка перед мерджем)
# - мердж PR у build        → тести + збірка PhillBot.exe (артефакт запуску на 30 днів)
# - тег v* (напр. v0.1.0)   → тести + збірка + GitHub Release з PhillBot.exe
# Пуші в main нічого не збирають.

on:
  pull_request:
    branches: [build]
  push:
    branches: [build]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Тести
        run: go test ./...

      - name: Тести консольного бота
        working-directory: bot
        run: go test ./...

      - name: Wails CLI
        if: github.event_name != 'pull_request'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Збірка
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "build-$($env:GITHUB_RUN_NUMBER)-$($env:GITHUB_SHA.Substring(0,7))" }
          wails build -clean -skipbindings -trimpath -ldflags "-s -w -X main.version=$version"
          Get-Item build/bin/PhillBot.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: PhillBot-${{ github.run_number }}
          path: app/build/bin/PhillBot.exe
          retention-days: 30

      - name: Реліз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/bin/PhillBot.exe
          generate_release_notes: true
