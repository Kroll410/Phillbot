<!DOCTYPE html>
<!-- Віджет гри (етап 2): переможне замовлення і таймер гри. Показується лише під час гри.
     Параметри: ?title=Граємо&hideIdle=1&scale=1&theme=box|shadow|plain&align=center -->
<html lang="uk"><head><meta charset="utf-8"><title>PhillBot — гра</title>
<link rel="stylesheet" href="overlay.css">
<style>
  #w{display:inline-block;min-width:calc(320px * var(--scale))}
  .lbl{font-size:calc(20px * var(--scale));color:var(--muted);letter-spacing:.5px}
  .game{font-size:calc(34px * var(--scale));margin:calc(2px * var(--scale)) 0 calc(4px * var(--scale));overflow-wrap:anywhere}
  .t{font-size:calc(76px * var(--scale));font-variant-numeric:tabular-nums;line-height:1;letter-spacing:2px}
  .paused .t{color:var(--warn)} .low .t{color:var(--bad);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.55}}
</style></head>
<body class="theme-box align-center">
<div id="w" class="box fade out"><div class="lbl" id="lbl"></div><div class="game" id="g"></div><div class="t" id="t">--:--</div></div>
<script src="overlay.js"></script>
<script>
(() => {
  const title = OV.param("title", "Граємо"), hideIdle = OV.flag("hideIdle", true);
  let S = null;
  function rem(){ const g = S.game; return g.status === "running" ? g.endsAt - OV.serverNow() : g.remainingMs; }
  function tick(){
    if(!S) return;
    const play = S.phase === "play", g = S.game || {}, r = rem(), w = document.getElementById("w");
    w.className = "box fade " + (g.status || "") + (g.status === "running" && r <= 60000 ? " low" : "") + (!play && hideIdle ? " out" : "");
    document.getElementById("lbl").textContent = g.status === "paused" ? title + " — пауза" : title;
    document.getElementById("g").textContent = S.winner || "";
    document.getElementById("t").textContent = OV.fmtTime(play ? r : 0);
  }
  OV.connect({ state: s => { S = s; tick(); } });
  setInterval(tick, 200);
})();
</script>
</body></html>
