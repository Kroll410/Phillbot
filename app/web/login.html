<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhillBot — вхід</title>
<style>
  :root{--bg:#0e0e10;--panel:#18181b;--line:#2a2a30;--text:#efeff1;--muted:#adadb8;--grad:linear-gradient(90deg,#00c853,#9147ff)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 Inter,"Segoe UI",system-ui,sans-serif;padding:16px}
  .card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 26px}
  .logo{font:700 26px/1 Inter,"Segoe UI",sans-serif;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0 0 18px}
  p{margin:0 0 18px;color:var(--muted)}
  .msg{color:#ffb4ae;background:rgba(255,90,82,.08);border:1px solid rgba(255,90,82,.25);border-radius:10px;padding:10px 12px;margin:0 0 16px}
  .msg:empty{display:none}
  a.btn{display:block;text-align:center;text-decoration:none;color:#fff;font-weight:600;padding:12px 16px;border-radius:10px;background:var(--grad)}
  a.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .legal{margin:16px 0 0;font-size:12.5px;color:var(--muted)}
  .legal a{color:#c9a6ff}
</style></head>
<body>
<main class="card">
  <h1 class="logo">PhillBot</h1>
  <div class="msg" role="alert"><!--MSG--></div>
  <p>Увійдіть акаунтом свого каналу Twitch. Доступ — лише за запрошенням.</p>
  <a class="btn" href="/auth/login">Увійти через Twitch</a>
  <p class="legal">Входячи, ви погоджуєтесь з <a href="/terms">Умовами користування</a> і <a href="/privacy">Політикою конфіденційності</a>.
    · <a href="/en/terms">Terms</a> · <a href="/en/privacy">Privacy</a></p>
</main>
</body></html>
