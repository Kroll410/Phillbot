<!DOCTYPE html>
<!-- Таймер збору. Параметри: ?title=Збір замовлень&hideIdle=1&finishedFor=15&scale=1&theme=shadow|box|plain&align=center -->
<html lang="uk"><head><meta charset="utf-8"><title>СабДей — таймер</title>
<link rel="stylesheet" href="overlay.css">
<style>
  #w{display:inline-block;min-width:calc(260px * var(--scale))}
  .lbl{font-size:calc(22px * var(--scale));color:var(--muted);letter-spacing:.5px}
  .t{font-size:calc(84px * var(--scale));font-variant-numeric:tabular-nums;line-height:1;letter-spacing:2px}
  .running .t{color:var(--text)} .paused .t{color:var(--warn)} .finished .t{color:var(--muted)}
  .low .t{color:var(--bad);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.55}}
  .sub{font-size:calc(18px * var(--scale));color:var(--muted)}
</style></head>
<body class="align-center">
<div id="w" class="box fade"><div class="lbl" id="lbl"></div><div class="t" id="t">--:--</div><div class="sub" id="sub"></div></div>
<script src="overlay.js"></script>
<script>
(() => {
  const title = OV.param("title", "Збір замовлень"), hideIdle = OV.flag("hideIdle", true), finishedFor = OV.num("finishedFor", 15) * 1000;
  let S = null;
  function tick() {
    if (!S) return;
    const s = S.session, r = OV.remaining(S), w = document.getElementById("w");
    const recentlyFinished = s.status === "finished" && OV.serverNow() - (s.finishedAt || 0) < finishedFor;
    const visible = !hideIdle || s.status === "running" || s.status === "paused" || recentlyFinished;
    w.classList.toggle("out", !visible);
    w.className = "box fade " + s.status + (s.status === "running" && r <= 30000 ? " low" : "") + (visible ? "" : " out");
    document.getElementById("t").textContent = OV.fmtTime(s.status === "finished" ? 0 : r);
    document.getElementById("lbl").textContent = s.status === "paused" ? title + " — пауза" : s.status === "finished" ? "Збір завершено" : title;
    document.getElementById("sub").textContent = OV.flag("orders", true) && S.totals.entries ? `${S.totals.entries} замовлень · ${S.totals.points} балів` : "";
  }
  OV.connect({ state: s => { S = s; tick(); } });
  setInterval(tick, 200);
})();
</script>
</body></html>
